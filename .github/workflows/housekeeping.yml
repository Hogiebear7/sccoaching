name: Housekeeping cron

# Triggers the app's own job runner (lib/jobs/*.ts via app/api/cron/run)
# on a schedule, since the production host (Hostinger) has no built-in
# scheduler of its own. See docs/scheduler.md for the full picture.
#
# Requires two repository secrets (Settings > Secrets and variables >
# Actions), set once:
#   PROD_URL     e.g. https://your-domain.com (no trailing slash)
#   CRON_SECRET  must match the CRON_SECRET env var set on the Hostinger
#                deployment itself — this workflow does not set that part.

on:
  schedule:
    # Every 15 minutes, matching vercel.json's cadence (the fastest class
    # reminder window is 60 minutes out, with a 4-hour staleness cutoff —
    # 15 minutes keeps sends comfortably prompt without hammering the host).
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  run-housekeeping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/run
        run: |
          if [ -z "${{ secrets.PROD_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::PROD_URL and/or CRON_SECRET repository secrets are not set. See .github/workflows/housekeeping.yml for setup."
            exit 1
          fi
          # A single transient failure (server mid-restart, brief network
          # blip) used to mean waiting for the next scheduled trigger —
          # 15+ minutes away, and GitHub's own scheduling jitter can push
          # that further still (observed gaps of 50+ minutes in practice).
          # curl's own retry machinery absorbs that within this one run
          # instead: --retry-all-errors + --fail widens retry eligibility
          # beyond curl's default transient-error list to any non-2xx
          # response. Each individual attempt is still capped at 180s via
          # --max-time. --retry-max-time 300 bounds overall retry behavior,
          # but curl measures that timer from before the first attempt and
          # it includes retry delays — so it's not a strict "300s of
          # retrying after the first failure" budget. A final attempt that
          # starts just before the 300s mark can still run to completion
          # (up to its own 180s max-time), so real wall-clock duration can
          # exceed 300s slightly. Either way this stays well inside the
          # 15-minute schedule interval.
          set +e
          status=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            --max-time 180 \
            --retry 3 \
            --retry-delay 10 \
            --retry-max-time 300 \
            --retry-all-errors \
            --fail \
            "${{ secrets.PROD_URL }}/api/cron/run" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          curl_exit=$?
          set -e
          echo "HTTP status: $status"
          cat response.json 2>/dev/null || true
          if [ "$curl_exit" -ne 0 ] || [ "$status" -ge 300 ]; then
            echo "::error::Housekeeping run failed with HTTP $status (curl exit $curl_exit) after retries"
            exit 1
          fi
