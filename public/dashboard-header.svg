<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" preserveAspectRatio="xMidYMid slice" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132844"/>
      <stop offset="0.55" stop-color="#0d1c30"/>
      <stop offset="1" stop-color="#0A1526"/>
    </linearGradient>
    <radialGradient id="gold" cx="0.78" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#C6A15B" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#C6A15B" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#C6A15B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="400" fill="url(#base)"/>
  <rect width="1600" height="400" fill="url(#gold)"/>

  <!-- faint grid texture, right-biased so the left (greeting) stays clean -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M900 0V400 M1000 0V400 M1100 0V400 M1200 0V400 M1300 0V400 M1400 0V400 M1500 0V400"/>
    <path d="M900 100H1600 M900 200H1600 M900 300H1600"/>
  </g>

  <!-- single restrained gold streak, right — one accent, not scattered lime -->
  <g transform="skewX(-18)">
    <rect x="1250" y="-80" width="46" height="620" fill="#C6A15B" opacity="0.12"/>
    <rect x="1320" y="-80" width="14" height="620" fill="#C6A15B" opacity="0.32"/>
  </g>

  <!-- faint athletic line motif, far right, tolerant to vertical cropping -->
  <g fill="none" stroke="#C6A15B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.10">
    <path d="M1120 120 L1210 200 L1120 280"/>
    <path d="M1250 120 L1340 200 L1250 280"/>
  </g>
</svg>
